# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Pretorsion theories and image-closed subcategories"
  description: >-
    A Lean 4 formalization, built on Mathlib, of the paper Pretorsion theories and
    image-closed subcategories. For a finite-dimensional algebra Λ over a field, a
    subcategory Z of mod Λ is image-closed iff Z = Gen Z ∩ Cogen Z iff Z = T ∩ F for
    a pretorsion theory (T, F) (Theorem A), and the pretorsion theories of mod Λ
    form a complete lattice with the meets and joins of the paper (Theorem 3.6).
    For the linearly oriented quiver 1 → ⋯ → n, the pretorsion theories counted by
    the number of indecomposables in T ∩ F, and the image-closed subcategories
    counted by their number of indecomposables, are enumerated by the q-Gandhi
    polynomials B_{n+1}(1, q) and C_{n+1}(1, q) of Han and Zeng (Theorem B), with
    the two-variable refinements of Theorems 7.5 and 8.5. The library also proves
    the other numbered statements of the paper, including the convex geometry of
    image closure (Section 4.3), and the cited inputs they use.
  authors: ["Haruhisa Enomoto"]
  responsible_maintainers: ["Haruhisa Enomoto"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.RT", "math.CT", "math.CO"]
  msc2020: ["16G20", "18E40", "05A15"]

sources:
