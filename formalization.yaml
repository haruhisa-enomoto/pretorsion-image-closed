# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Pretorsion theories and image-closed subcategories"
  description: >-
    A Lean 4 formalization, built on Mathlib, of the paper Pretorsion theories and
    image-closed subcategories, in two parts. Structure: for a finite-dimensional
    algebra Λ over a field, a subcategory Z of mod Λ is image-closed iff
    Z = Gen Z ∩ Cogen Z iff Z = T ∩ F for a pretorsion theory (T, F) (Theorem A),
    and the pretorsion theories of mod Λ form a complete lattice with the meets and
    joins of the paper (Theorem 3.6). Enumeration: for the linearly oriented quiver
    1 → ⋯ → n, the pretorsion theories, weighted by q to the number of
    indecomposables in T ∩ F, and the image-closed subcategories, weighted by q to
    their number of indecomposables, sum to the q-Gandhi polynomials B_{n+1}(1, q)
    and C_{n+1}(1, q) of Han and Zeng (Theorem B), with the two-variable
    refinements of Theorems 7.5 and 8.5. At q = 1 these are the Genocchi numbers
    g_{2n+4} and the median Genocchi numbers H_{2n+3}; that classical evaluation is
    not formalized. The library also proves the other numbered statements of the
    paper, including the convex geometry of image closure (Section 4.3), and the
    cited inputs they use.
  authors: ["Haruhisa Enomoto"]
  responsible_maintainers: ["Haruhisa Enomoto"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.RT", "math.CT", "math.CO"]
  msc2020: ["16G20", "18E40", "05A15"]

sources:
  - title: "Pretorsion theories and image-closed subcategories"
    authors: ["Haruhisa Enomoto"]
    type: "paper"
    location: "https://hexagonmath.org/2611.00207v1"
    relationship: "formalizes"
    note: >-
      The formalized paper, researched under the author's direction with
      GPT-5.6-Sol and GPT-6-Astra and written with GPT-6-Astra, Claude Opus 5.5
      and Gemini 4 Argon. Statements are matched with Lean declarations in
      docs/PAPER-CORRESPONDENCE.md. The posted TeX source of hexagon:2611.00207v1
      is byte-identical to the formalized version (SHA-256 in docs/MANUSCRIPT.md).
    author_endorsement: "participated"
  - title: "q-Polynômes de Gandhi et statistique de Denert"
    authors: ["G.-N. Han", "J. Zeng"]
    type: "paper"
    location: "Discrete Math. 205 (1999), 119–143"
    relationship: "background"
    note: >-
      Source of the q-Gandhi polynomials of the first kind B_m, defined in
      Statement.lean by the recurrence of Definition 1.1 of the paper. The
      specialization B_m(1,1) = g_{2m+2} is not formalized.
    author_endorsement: "not-contacted"
  - title: "On a q-sequence that generalizes the median Genocchi numbers"
    authors: ["G.-N. Han", "J. Zeng"]
    type: "paper"
    location: "Ann. Sci. Math. Québec 23 (1999), no. 1, 63–72"
    relationship: "background"
    note: >-
      Source of the q-Gandhi polynomials of the second kind C_m, defined in
      Statement.lean by the recurrence of Definition 1.1 of the paper. The
      specialization C_m(1,1) = H_{2m+1} is not formalized.
    author_endorsement: "not-contacted"

  - title: "Pretorsion theories in general categories"
    authors: ["A. Facchini", "C. A. Finocchiaro", "M. Gran"]
    type: "paper"
    location: "J. Pure Appl. Algebra 225 (2021), no. 2, Paper No. 106503"
    relationship: "background"
    note: >-
      Definition 2.6 there is the paper's Definition 2.2, stated in Lean for an
      arbitrary category; Propositions 2.1–2.2 there (the paper's Lemma 2.11) are
      proved in the library. The notion was introduced by Facchini and Finocchiaro
      (Ann. Mat. Pura Appl. 199 (2020), 1073–1089).
    author_endorsement: "not-contacted"
  - title: "Lattices of pretorsion classes"
    authors: ["F. Campanini", "F. Fedele", "E. Yıldırım"]
    type: "paper"
    location: "arXiv:2511.19223v1 (2025)"
    relationship: "background"
    note: >-
      Shows that the first and second components of pretorsion theories in
      mod Λ are the quotient-closed and submodule-closed subcategories, and lists
      the 17 pretorsion theories for type A_2. The closure properties used by the
      paper (Lemma 2.6 and Proposition 2.8 there; the paper's Proposition 2.3)
      are proved in the library.
    author_endorsement: "not-contacted"
  - title: "Preprojective modules over Artin algebras"
    authors: ["M. Auslander", "S. O. Smalø"]
    type: "paper"
    location: "J. Algebra 66 (1980), no. 1, 61–122"
    relationship: "background"
    note: >-
      Proposition 4.10(i), Z is image-closed iff Z = Gen Z ∩ Cogen Z, is part of
      Theorem A and is proved in the library; splitting projective and injective
      objects (Section 2) are used in Section 4.3.
    author_endorsement: "not-contacted"
  - title: "An equidistribution conjecture for quotient-closed and submodule-closed subcategories"
    authors: ["Haruhisa Enomoto"]
    type: "paper"
    location: "arXiv:2608.18024v1 (2026)"
    relationship: "background"
    note: >-
      Motivates counting subcategories by their number of indecomposables, and
      supplies the convex geometry of quotient and submodule closure extended in
      Section 4.3; its formalization is listed under related_formalizations.
    author_endorsement: "participated"
  - title: "Plumbing bijections"
    authors: ["V. Pilaud"]
    type: "paper"
    location: "arXiv:2512.05001v2 (2025)"
    relationship: "background"
    note: >-
      Also obtains the count H_{2n+3} for intersection-closed interval families,
      which correspond to image-closed subcategories of mod Λ_n by Theorem 5.5.
      Not used in the proofs.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/haruhisa-enomoto/quotient-submodule-equidistribution"
    relationship: "adapts"
    note: >-
      14 modules adapted for Section 4.3 (convex geometries, indecomposable
      skeletons, anti-exchange, relative split projectives and injectives), from
      commit 20ee4b9; see VENDORED.md and verification/module-origins.json.
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "adapts"
    note: >-
      2 modules (indecomposable modules and Fitting's lemma; idempotents of local
      rings) from the development state of commit eeb5b4b (not a published
      revision), through quotient-submodule-equidistribution, with copyright
      headers kept; see VENDORED.md.

status:
  scope: >-
    Theorem A, Theorem 3.6 with the meet and join formulas and the least and
    greatest elements, Theorems 7.5 and 8.5, and Theorem B, as stated in the paper,
    for an arbitrary field. The compared statements in Challenge.lean use only
    Mathlib definitions. Every numbered statement of the paper is covered or
    recorded as not needed in docs/PAPER-CORRESPONDENCE.md; Section 4.3 is proved
    in the library but not compared. The identities B_m(1,1) = g_{2m+2} and
    C_m(1,1) = H_{2m+1} with Genocchi numbers are classical and not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable 5.1", "Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        An AI coding agent working in a local Lean project with compiler
        feedback, explicit axiom audits and a statement-by-statement correspondence
        with the paper, under the author's direction. Section 4.3 reuses an earlier
        formalization listed in VENDORED.md.
      cost:
        wall_time: "About one day of development (November 8, 2026)"
        spend_usd: "subscription-based"
        hardware: "Local Linux workstation"
      prompting_notes: >-
        The author required the whole paper and its cited inputs to be proved, with
        Mathlib as the only dependency, and allowed proof routes that differ from
        the paper.
  spend_usd: "subscription-based"
  notes: >-
    The paper was researched and written with AI models under the author's
    direction (see PROVENANCE.md). The formalization was written by AI coding
    agents under the author's direction.

fidelity:
  divergences: >-
    The statements are those of the paper. Modules are finite-dimensional right
    modules, realized as finitely generated modules over Λᵐᵒᵖ; a subcategory is a
    property of objects closed under isomorphisms, finite direct sums and direct
    summands, as in the paper's conventions. mod Λ_n is the category of functors
    from the linear order Fin n to finite-dimensional vector spaces, which the
    paper identifies with mod Λ_n. Polynomials in q and x live in ℤ[q][x], and
    Δ_q f is characterized by g · (1 + (q - 1)x) = f(1 + qx) - f(x). Sums over
    PT(Λ_n) and L_im(Λ_n) come with proofs that these sets are finite. All types
    live in one universe. Intermediate results are proved for abelian categories
    with a length function, and some by a different route; docs/proofs lists
    these. No weakening of the hypotheses or conclusions is known.

review:
  status: "unreviewed"
  notes: >-
    The statements and proofs have not been reviewed by a human expert or by an
    independent agent audit.

